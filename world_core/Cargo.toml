[workspace]
members = [
    "apps/world_viewer",
    "crates/worldspec",
    "crates/semantic_kernel",
    "crates/asset_contract",
    "crates/gameplay_contract",
    "crates/project_ledger",
    "crates/reference_runtime",
    "crates/intake_repair_contract",
    "crates/certification_authority",
    "crates/live_evidence_contract",
    "crates/native_graphics_contract",
    "crates/wge_control_plane",
]
# The default native gate intentionally excludes the compatibility worldspec,
# semantic-kernel, and inspection-app lanes. They remain workspace members so
# they can be audited explicitly, but cannot enter the native gate by accident.
default-members = [
    "crates/asset_contract",
    "crates/gameplay_contract",
    "crates/project_ledger",
    "crates/reference_runtime",
    "crates/intake_repair_contract",
    "crates/certification_authority",
    "crates/live_evidence_contract",
    "crates/native_graphics_contract",
    "crates/wge_control_plane",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Codeweald contributors"]
rust-version = "1.95"
