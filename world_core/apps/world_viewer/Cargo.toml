[package]
name = "codeweald-world-viewer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Model-native Bevy live viewer for certified Codeweald worlds"

[dependencies]
anyhow = "1.0"
bevy = { version = "0.19.0", default-features = false, features = [
    "3d",
    "file_watcher",
    "free_camera",
    "ui",
] }
codeweald-worldspec = { path = "../../crates/worldspec" }
serde_json = "1.0"
