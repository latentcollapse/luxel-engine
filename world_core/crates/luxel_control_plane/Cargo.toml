[package]
name = "luxel-control-plane"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Canonical bounded native Luxel project transaction and agent operation surface"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
luxel-certification-authority = { path = "../certification_authority" }
luxel-project-ledger = { path = "../project_ledger" }
luxel-reference-runtime = { path = "../reference_runtime" }

[[bin]]
name = "luxel-control-plane"
path = "src/main.rs"
