[package]
name = "luxel-reference-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Engine-neutral Luxel world compiler and deterministic reference runtime"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
luxel-gameplay-contract = { path = "../gameplay_contract" }

[[bin]]
name = "luxel-reference-runtime"
path = "src/main.rs"
