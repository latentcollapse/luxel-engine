[package]
name = "wge-native-graphics-contract"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Typed, engine-neutral WGE scene packets and native graphics evidence"

[dependencies]
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
wge-reference-runtime = { path = "../reference_runtime" }

[[bin]]
name = "wge-native-graphics-contract"
path = "src/main.rs"
