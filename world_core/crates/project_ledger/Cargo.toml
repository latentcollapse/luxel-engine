[package]
name = "luxel-project-ledger"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Rust-owned typed project specification, artifact graph, evidence, and Unity handoff for Luxel"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
luxel-intake-repair-contract = { path = "../intake_repair_contract" }
luxel-reference-runtime = { path = "../reference_runtime" }
luxel-asset-contract = { path = "../asset_contract" }

[[bin]]
name = "luxel-project-ledger"
path = "src/main.rs"
